name: DesignSystem tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/Paladala/Packages/DesignSystem/**'
      - '.github/workflows/design-system.yml'
  push:
    branches:
      - working
    paths:
      - 'ios/Paladala/Packages/DesignSystem/**'
      - '.github/workflows/design-system.yml'

permissions:
  contents: read

jobs:
  test:
    name: swift package tests (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test DesignSystem
        working-directory: ios/Paladala/Packages/DesignSystem
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')"
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -scheme DesignSystem \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
